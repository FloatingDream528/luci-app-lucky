name: Build Lucky APK

on:
  push:
    paths:
      - "lucky/**"
      - "luci-app-lucky/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "lucky/**"
      - "luci-app-lucky/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # Run automatically at 16:00 UTC (00:00 Beijing time) every day

permissions:
  contents: read

concurrency:
  group: lucky-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-update:
    name: Check for Lucky Updates
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      latest_version: ${{ steps.check.outputs.latest_version }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Check latest version
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          bash scripts/prepare-latest-lucky.sh --check-only

          LATEST_TAG="$(grep '^latest_tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          RELEASE_TAG="$(grep '^release_tag=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"

          echo "Latest official version: $LATEST_TAG"
          echo "Target GitHub release tag: $RELEASE_TAG"

          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Skipping scheduled build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version found or manual/push trigger. Proceeding with build..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "latest_version=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }} APK
    needs: check-update
    if: needs.check-update.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64_generic, arm_cortex-a7_neon-vfpv4, mips_24kc, mipsel_24kc, i386_pentium4]
        include:
          - arch: x86_64
            sdk_arch: x86_64-25.12.6
            core_arch: x86_64
            build_luci: "1"
          - arch: aarch64_generic
            sdk_arch: aarch64_generic-25.12.6
            core_arch: arm64
            build_luci: "0"
          - arch: arm_cortex-a7_neon-vfpv4
            sdk_arch: arm_cortex-a7_neon-vfpv4-25.12.6
            core_arch: armv7
            build_luci: "0"
          - arch: mips_24kc
            sdk_arch: mips_24kc-25.12.6
            core_arch: mips_softfloat
            build_luci: "0"
          - arch: mipsel_24kc
            sdk_arch: mipsel_24kc-25.12.6
            core_arch: mipsle_softfloat
            build_luci: "0"
          - arch: i386_pentium4
            sdk_arch: i386_pentium4-25.12.6
            core_arch: i386
            build_luci: "0"
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      upstream_version: ${{ steps.meta.outputs.upstream_version }}
      release_url: ${{ steps.meta.outputs.release_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache OpenWrt SDK archive
        uses: actions/cache@v6
        with:
          path: .sdk-cache
          key: openwrt-sdk-archive-v1-${{ matrix.sdk_arch }}

      - name: Prepare latest Lucky core
        shell: bash
        env:
          LUCKY_CORE_ARCH: ${{ matrix.core_arch }}
          LUCKY_TARGET_TAG: ${{ needs.check-update.outputs.latest_version }}
        run: bash scripts/prepare-latest-lucky.sh

      - name: Export release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source .lucky-release.env
          {
            echo "version=${PKG_VERSION}"
            echo "tag=lucky-${PKG_VERSION}"
            echo "upstream_version=${LUCKY_UPSTREAM_VERSION}"
            echo "release_url=${LUCKY_RELEASE_ROOT}/${LUCKY_RELEASE_DIR}/"
          } >> "$GITHUB_OUTPUT"

      - name: Prefetch SDK archive & build packages
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/openwrt/sdk:${{ matrix.sdk_arch }}"
          docker pull "$IMAGE"

          mkdir -p .sdk-cache artifacts_out
          cached_tar="$(find .sdk-cache -maxdepth 1 -type f -name '*sdk-*.tar.*' | head -n 1 || true)"

          if [ -z "$cached_tar" ] || [ ! -f .sdk-cache/sha256sums_min ]; then
            echo "SDK 缓存未命中，使用 aria2c 16 线程并发拉取 SDK (${{ matrix.sdk_arch }})..."
            if ! command -v aria2c >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y aria2
            fi
            rm -rf .sdk-cache/*

            eval "$(python3 - "$IMAGE" <<'PY'
          import json, shlex, subprocess, sys
          info = json.loads(subprocess.check_output(["docker", "image", "inspect", sys.argv[1]]))[0]
          env = dict(item.split("=", 1) for item in info["Config"]["Env"] if "=" in item)
          for k in ("TARGET", "VERSION_PATH", "DOWNLOAD_FILE"):
              if k in env:
                  print(f"{k}={shlex.quote(env[k])}")
          PY
            )"

            DOWNLOAD_PATH="${VERSION_PATH}/targets/${TARGET}"
            curl -fSL --connect-timeout 10 --retry 5 "https://downloads.cdn.openwrt.org/${DOWNLOAD_PATH}/sha256sums" -o .sdk-cache/sha256sums
            curl -fSL --connect-timeout 10 --retry 5 "https://downloads.cdn.openwrt.org/${DOWNLOAD_PATH}/sha256sums.asc" -o .sdk-cache/sha256sums.asc

            file_name="$(grep "$DOWNLOAD_FILE" .sdk-cache/sha256sums | cut -d '*' -f 2 | head -n 1)"
            if [ -z "$file_name" ]; then
              echo "错误: 未在 sha256sums 中找到匹配的 SDK ($DOWNLOAD_FILE)" >&2
              exit 1
            fi

            aria2c \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=1M \
              --max-tries=10 \
              --retry-wait=3 \
              --summary-interval=10 \
              --console-log-level=warn \
              -d .sdk-cache \
              -o "$file_name" \
              "https://downloads.cdn.openwrt.org/${DOWNLOAD_PATH}/${file_name}" \
              "https://downloads.openwrt.org/${DOWNLOAD_PATH}/${file_name}"

            grep "$file_name" .sdk-cache/sha256sums > .sdk-cache/sha256sums_min
            (cd .sdk-cache && sha256sum -c sha256sums_min)
          else
            echo "已命中本地 SDK 缓存: $(basename "$cached_tar")"
          fi

          host_uid="$(id -u)"
          host_gid="$(id -g)"
          restore_perms() {
            sudo chown -R "${host_uid}:${host_gid}" .sdk-cache artifacts_out "$GITHUB_WORKSPACE"
          }
          trap restore_perms EXIT

          sudo chown -R 1000:1000 .sdk-cache artifacts_out "$GITHUB_WORKSPACE"

          docker run --rm \
            -e BUILD_LUCI="${{ matrix.build_luci }}" \
            -v "$GITHUB_WORKSPACE:/feed" \
            -v "$GITHUB_WORKSPACE/.sdk-cache:/sdk-cache" \
            -v "$GITHUB_WORKSPACE/artifacts_out:/artifacts" \
            "$IMAGE" \
            bash /feed/scripts/build-openwrt-apk.sh

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          mkdir -p "artifacts/$arch"
          cp -v .lucky-release.env artifacts/
          cp -v scripts/install-apk.sh "artifacts/$arch/install-apk.sh"
          chmod 0755 "artifacts/$arch/install-apk.sh"

          find artifacts_out/bin -type f -name "lucky-*.apk" \
            -print -exec cp -v {} "artifacts/$arch/" \;

          for apk in "artifacts/$arch"/*.apk; do
            name="$(basename "$apk")"
            clean_name="$(printf '%s' "$name" | sed -E 's/-r[0-9]+(\.apk)$/\1/')"
            [ "$name" = "$clean_name" ] || mv -v "$apk" "artifacts/$arch/$clean_name"
          done

          test -n "$(find "artifacts/$arch" -type f -name 'lucky-*.apk' -print -quit)"

          if [ "${{ matrix.build_luci }}" = "1" ]; then
            mkdir -p "artifacts/noarch"
            find artifacts_out/bin -type f \( \
              -name "luci-app-lucky-*.apk" -o \
              -name "luci-i18n-lucky-zh-cn-*.apk" \
            \) -print -exec cp -v {} "artifacts/noarch/" \;

            for apk in "artifacts/noarch"/*.apk; do
              name="$(basename "$apk")"
              clean_name="$(printf '%s' "$name" | sed -E 's/-r[0-9]+(\.apk)$/\1/')"
              [ "$name" = "$clean_name" ] || mv -v "$apk" "artifacts/noarch/$clean_name"
            done

            test -n "$(find "artifacts/noarch" -type f -name 'luci-app-lucky-*.apk' -print -quit)"
            test -n "$(find "artifacts/noarch" -type f -name 'luci-i18n-lucky-zh-cn-*.apk' -print -quit)"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lucky-${{ matrix.arch }}-apk
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-upload
          pattern: lucky-*-apk
          merge-multiple: true

      - name: Archive architecture folders
        shell: bash
        run: |
          set -euo pipefail
          cd release-upload
          test -d noarch
          for dir in */ ; do
            arch_dir="${dir%/}"
            [ "$arch_dir" = "noarch" ] && continue
            if [ -d "$arch_dir" ]; then
              cp -v noarch/*.apk "$arch_dir/"
              echo "Zipping architecture: $arch_dir"
              zip -j "lucky-${{ needs.build.outputs.version }}-${arch_dir}.zip" "$arch_dir"/*
            fi
          done

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Lucky ${{ needs.build.outputs.version }}"
            echo
            echo "- \`lucky\` 包已内置对应架构预编译核心，安装或启动服务时无需二次在线下载。"
            echo "- \`luci-app-lucky\` 采用纯客户端 LuCI JS 构建，无需 \`luci-compat\` 兼容层。"
            echo "- 核心来源: ${{ needs.build.outputs.release_url }}"
            echo
            echo "### 方式一：SSH 一键自动识别架构在线安装"
            echo
            echo '```sh'
            echo 'sh -c "$(wget -qO- https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/online-install.sh)"'
            echo '```'
            echo
            echo "### 方式二：下载对应架构 Zip 解压上传至 \`/tmp\` 后安装"
            echo
            echo '```sh'
            echo 'cd /tmp'
            echo 'sh ./install-apk.sh'
            echo '# 或手动执行：'
            echo '# apk add --allow-untrusted ./lucky-*.apk ./luci-app-lucky-*.apk ./luci-i18n-lucky-zh-cn-*.apk'
            echo '```'
            echo
            echo "> 注意：请勿使用 LuCI 网页「上传软件包」入口（该入口不携带 \`--allow-untrusted\`，会报 \`UNTRUSTED signature\`）。"
            echo
            echo "### Release Files"
            find release-upload -type f -name "*.zip" -printf "- \`%f\`\n" | sort
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.tag }}
          RELEASE_NAME: Lucky ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-upload/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Zip files found for release"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file release-notes.md
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$TAG_NAME" "$asset" --yes
            done < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name | select(endswith(".zip"))')
            gh release upload "$TAG_NAME" "${files[@]}" --clobber
          else
            prerelease_args=()
            if [[ "$TAG_NAME" == *beta* || "$TAG_NAME" == *alpha* || "$TAG_NAME" == *rc* ]]; then
              prerelease_args=(--prerelease)
            fi
            gh release create "$TAG_NAME" "${files[@]}" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
